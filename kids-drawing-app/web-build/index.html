<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#9B59B6">
  <title>Anges World 🎨</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    body{background:#EDD5FF;}

    /* ── Screens ── */
    .screen{display:none;width:100%;height:100vh;flex-direction:column;}
    .screen.active{display:flex;}

    /* ── Header bar ── */
    .header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
      background:rgba(255,255,255,0.4);border-bottom:1px solid rgba(200,160,230,0.3);flex-shrink:0;}
    .header h2{font-size:17px;font-weight:800;color:#5A3070;}
    .back-btn{font-size:15px;font-weight:700;color:#7B3FA0;background:none;border:none;cursor:pointer;padding:4px 8px;}
    .save-btn{font-size:14px;font-weight:700;color:#9B59B6;background:none;border:none;cursor:pointer;padding:4px 8px;}

    /* ══════════════════════════ HOME SCREEN ══════════════════════════ */
    #screen-home{
      background:linear-gradient(160deg,#EDD5FF 0%,#FFD6EC 38%,#D6EEFF 68%,#E0FFD6 100%);
      overflow-y:auto;position:relative;
    }
    .home-title{text-align:center;padding:18px 16px 6px;position:relative;z-index:2;}
    .home-title .emoji{font-size:52px;display:block;margin-bottom:4px;}
    .home-title h1{font-size:36px;font-weight:900;color:#7B3FA0;letter-spacing:-1px;}
    .home-title p{font-size:14px;color:#B06FC4;font-weight:600;margin-top:4px;}

    /* floating decorations */
    .floaties{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
    .floaty{position:absolute;font-size:22px;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

    /* game board spots */
    .board-svg{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:0;}

    /* jump game */
    .game-box{margin:10px 16px 4px;border-radius:18px;overflow:hidden;
      background:rgba(255,255,255,0.45);border:2px solid rgba(255,255,255,0.7);
      flex-shrink:0;position:relative;z-index:2;}
    .game-label{font-size:11px;font-weight:800;color:#9B59B6;text-transform:uppercase;
      letter-spacing:.5px;padding:6px 12px 2px;}
    #game-canvas{display:block;cursor:pointer;touch-action:none;}

    /* mode buttons */
    .mode-buttons{padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px;
      position:relative;z-index:2;}
    .mode-btn{border:none;border-radius:22px;padding:14px 18px;cursor:pointer;
      display:flex;align-items:center;gap:14px;
      box-shadow:0 5px 14px rgba(123,63,160,0.22);text-align:left;transition:transform .1s;}
    .mode-btn:active{transform:scale(.97);}
    .mode-btn .btn-circle{width:52px;height:52px;border-radius:26px;
      background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);
      display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
    .mode-btn .btn-text{flex:1;}
    .mode-btn .btn-label{font-size:19px;font-weight:800;color:#fff;display:block;margin-bottom:2px;}
    .mode-btn .btn-sub{font-size:12px;color:rgba(255,255,255,.88);font-weight:500;}
    .mode-btn .btn-arrow{font-size:24px;color:rgba(255,255,255,.6);}
    #btn-draw{background:linear-gradient(135deg,#FF8DC7,#FF5BA3);}
    #btn-color{background:linear-gradient(135deg,#7EC8E3,#3FA9D0);}
    #btn-cbn{background:linear-gradient(135deg,#C39BD3,#9B59B6);}

    /* ══════════════════════════ DRAWING SCREEN ══════════════════════════ */
    #screen-draw{background:#E8E8E8;}
    .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;position:relative;}
    .canvas-wrap canvas{border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.12);touch-action:none;display:block;}

    /* palette */
    .palette-row{background:#FFF9F0;border-top:1px solid #FFE0A0;padding:6px 0;overflow-x:auto;
      display:flex;align-items:center;flex-shrink:0;white-space:nowrap;}
    .swatch{width:34px;height:34px;border-radius:17px;border:2px solid transparent;
      margin:0 4px;cursor:pointer;flex-shrink:0;transition:transform .1s;}
    .swatch.active{border-color:#333;transform:scale(1.22);}
    .swatch-white{border-color:#ddd!important;}

    /* toolbar */
    .draw-toolbar{background:#fff;border-top:2px solid #EEE;display:flex;
      align-items:center;padding:4px 10px;gap:4px;flex-shrink:0;}
    .tool-btn{width:42px;height:42px;border-radius:21px;border:none;background:none;
      font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .tool-btn.active{background:#FFE0A0;}
    .tool-btn:disabled{opacity:.3;}
    .brush-btns{display:flex;gap:2px;align-items:center;margin-right:4px;}
    .brush-btn{width:38px;height:38px;border-radius:19px;border:none;background:none;
      cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;color:#333;}
    .brush-btn.active{background:#FFE0A0;}
    .divider{width:1px;height:28px;background:#EEE;margin:0 6px;}

    /* ══════════════════════════ GALLERY SCREEN ══════════════════════════ */
    .gallery-screen{background:linear-gradient(160deg,#D6EEFF,#FFD6EC,#EDD5FF);}
    .gallery-hint{text-align:center;font-size:13px;font-weight:600;color:#9B59B6;
      padding:8px 24px;flex-shrink:0;}
    .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 24px;
      overflow-y:auto;}
    .gallery-card{background:rgba(255,255,255,.85);border-radius:20px;padding:16px 12px;
      display:flex;flex-direction:column;align-items:center;cursor:pointer;border:2px solid rgba(200,160,230,.4);
      box-shadow:0 3px 10px rgba(155,89,182,.15);transition:transform .1s;}
    .gallery-card:active{transform:scale(.96);}
    .gallery-card .card-emoji{font-size:56px;margin-bottom:8px;}
    .gallery-card .card-name{font-size:13px;font-weight:700;color:#5A3070;text-align:center;}
    .cbn-dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
    .cbn-dot{width:13px;height:13px;border-radius:50%;border:1px solid #bbb;}

    /* ══════════════════════════ CBN SCREEN ══════════════════════════ */
    #screen-cbn{background:linear-gradient(160deg,#EDD5FF,#FFD6EC,#D6EEFF);}
    .cbn-canvas-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:10px;}
    .cbn-svg-wrap{background:#fff;border-radius:14px;overflow:hidden;
      box-shadow:0 2px 12px rgba(155,89,182,.18);width:100%;max-width:360px;}
    .cbn-svg-wrap svg{display:block;width:100%;height:auto;}
    .cbn-selected-row{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;
      font-weight:600;color:#7B3FA0;flex-shrink:0;}
    .cbn-selected-swatch{width:28px;height:28px;border-radius:14px;border:2px solid #7B3FA0;flex-shrink:0;}
    .cbn-palette-wrap{background:rgba(255,255,255,.7);border-radius:16px;padding:12px;
      margin:8px 16px;width:calc(100% - 32px);max-width:360px;}
    .cbn-palette-title{font-size:11px;font-weight:800;color:#9B59B6;text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:8px;}
    .cbn-key-grid{display:flex;flex-wrap:wrap;gap:8px;}
    .cbn-key-item{display:flex;flex-direction:column;align-items:center;width:46px;
      padding:6px;border-radius:12px;border:2px solid transparent;cursor:pointer;}
    .cbn-key-item.active{border-color:#9B59B6;background:rgba(155,89,182,.1);}
    .cbn-key-swatch{width:32px;height:32px;border-radius:16px;border:1.5px solid #ddd;margin-bottom:4px;}
    .cbn-key-num{font-size:12px;font-weight:800;color:#555;}
    .cbn-key-item.active .cbn-key-num{color:#7B3FA0;}
    .cbn-reset-btn{margin:4px auto 16px;padding:9px 22px;border-radius:20px;border:1.5px solid rgba(155,89,182,.3);
      background:rgba(255,255,255,.7);color:#9B59B6;font-size:14px;font-weight:700;cursor:pointer;display:block;}
    .celebrate{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,240,255,.85);
      display:none;align-items:center;justify-content:center;border-radius:14px;z-index:10;}
    .celebrate.show{display:flex;}
    .celebrate-text{font-size:22px;font-weight:900;color:#7B3FA0;text-align:center;padding:16px;}
  </style>
</head>
<body>

<!-- ══ HOME SCREEN ══ -->
<div id="screen-home" class="screen active">
  <!-- Decorations -->
  <div class="floaties">
    <span class="floaty" style="left:7%;top:12%;animation-delay:0s">⭐</span>
    <span class="floaty" style="left:84%;top:14%;animation-delay:.3s">💜</span>
    <span class="floaty" style="left:14%;top:38%;animation-delay:.5s;font-size:16px">✨</span>
    <span class="floaty" style="left:77%;top:36%;animation-delay:.2s">🌸</span>
    <span class="floaty" style="left:4%;top:68%;animation-delay:.7s;font-size:16px">💙</span>
    <span class="floaty" style="left:87%;top:70%;animation-delay:.1s">🌟</span>
    <span class="floaty" style="left:50%;top:44%;animation-delay:.4s;font-size:14px">🩷</span>
  </div>

  <div class="home-title">
    <span class="emoji">🎨</span>
    <h1>Anges World</h1>
    <p>What do you want to make today?</p>
  </div>

  <!-- Jump game -->
  <div class="game-box">

  </div>

  <!-- Mode buttons -->
  <div class="mode-buttons">
    <button class="mode-btn" id="btn-draw" onclick="showDraw(null)">
      <div class="btn-circle">✏️</div>
      <div class="btn-text">
        <span class="btn-label">Free Draw</span>
        <span class="btn-sub">Draw anything you want!</span>
      </div>
      <span class="btn-arrow">›</span>
    </button>
    <button class="mode-btn" id="btn-color" onclick="showScreen('screen-coloring-gallery')">
      <div class="btn-circle">🖍️</div>
      <div class="btn-text">
        <span class="btn-label">Coloring Pages</span>
        <span class="btn-sub">Color a fun picture!</span>
      </div>
      <span class="btn-arrow">›</span>
    </button>
    <button class="mode-btn" id="btn-cbn" onclick="showScreen('screen-cbn-gallery')">
      <div class="btn-circle">🔢</div>
      <div class="btn-text">
        <span class="btn-label">Color by Number</span>
        <span class="btn-sub">Follow the numbers!</span>
      </div>
      <span class="btn-arrow">›</span>
    </button>
  </div>
</div>

<!-- ══ FREE DRAW SCREEN ══ -->
<div id="screen-draw" class="screen" style="background:#E8E8E8;">
  <div class="header" style="background:#FFF9E6;border-color:#FFE0A0;">
    <button class="back-btn" onclick="showScreen('screen-home')">← Back</button>
    <h2 id="draw-title">Free Draw</h2>
    <button class="save-btn" onclick="saveDrawing()">💾 Save</button>
  </div>
  <div class="canvas-wrap" id="draw-canvas-wrap">
    <canvas id="draw-canvas"></canvas>
  </div>
  <div class="palette-row" id="draw-palette"></div>
  <div class="draw-toolbar">
    <div class="brush-btns">
      <button class="brush-btn active" id="brush-s" onclick="setBrush(4,this)" title="Small">·</button>
      <button class="brush-btn" id="brush-m" onclick="setBrush(10,this)" title="Medium">—</button>
      <button class="brush-btn" id="brush-l" onclick="setBrush(22,this)" title="Large" style="font-size:24px">▬</button>
    </div>
    <div class="divider"></div>
    <button class="tool-btn" id="eraser-btn" onclick="toggleEraser()" title="Eraser">🧽</button>
    <button class="tool-btn" id="undo-btn" onclick="undoStroke()" title="Undo" disabled>↩️</button>
    <button class="tool-btn" onclick="clearCanvas()" title="Clear">🗑️</button>
  </div>
</div>

<!-- ══ COLORING PAGES GALLERY ══ -->
<div id="screen-coloring-gallery" class="screen gallery-screen">
  <div class="header" style="background:rgba(255,255,255,.4);border-color:rgba(163,200,230,.4);">
    <button class="back-btn" style="color:#3FA9D0" onclick="showScreen('screen-home')">← Back</button>
    <h2 style="color:#3FA9D0">🖍️ Coloring Pages</h2>
    <div style="width:64px"></div>
  </div>
  <p class="gallery-hint">Pick a picture and color it your way!</p>
  <div class="gallery-grid" id="coloring-gallery-grid"></div>
</div>

<!-- ══ COLOR BY NUMBER GALLERY ══ -->
<div id="screen-cbn-gallery" class="screen gallery-screen">
  <div class="header" style="background:rgba(255,255,255,.4);border-color:rgba(200,160,230,.3);">
    <button class="back-btn" onclick="showScreen('screen-home')">← Back</button>
    <h2>🔢 Color by Number</h2>
    <div style="width:64px"></div>
  </div>
  <p class="gallery-hint">Pick a picture, then follow the number key!</p>
  <div class="gallery-grid" id="cbn-gallery-grid"></div>
</div>

<!-- ══ COLOR BY NUMBER CANVAS ══ -->
<div id="screen-cbn" class="screen">
  <div class="header">
    <button class="back-btn" onclick="showScreen('screen-cbn-gallery')">← Back</button>
    <h2 id="cbn-title">Color by Number</h2>
    <button class="save-btn" onclick="saveCBN()">💾 Save</button>
  </div>
  <div class="cbn-canvas-wrap" id="cbn-canvas-wrap">
    <div class="cbn-svg-wrap" style="position:relative;">
      <div id="cbn-svg-container"></div>
      <div class="celebrate" id="cbn-celebrate">
        <div class="celebrate-text">🎉 Amazing!<br>You did it! 🎉</div>
      </div>
    </div>
    <div class="cbn-selected-row" id="cbn-selected-row">
      <span>👇 Tap a number below to pick a color</span>

    <div class="cbn-palette-wrap">
      <div class="cbn-palette-title">Color Key</div>
      <div class="cbn-key-grid" id="cbn-key-grid"></div>
    </div>
    <button class="cbn-reset-btn" onclick="resetCBN()">🗑️ Start Over</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  SCREEN MANAGEMENT
// ═══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-draw') initDrawCanvas();
}

// ═══════════════════════════════════════════════════════
//  JUMP GAME
// ═══════════════════════════════════════════════════════
(function() {
  const gc = document.getElementById('game-canvas');
  gc.width = window.innerWidth - 32;
  const W = gc.width, H = 100;
  const ctx = gc.getContext('2d');
  const GROUND = 14, CHAR_X = 52, CHAR_SIZE = 28, OBS_SIZE = 26;
  const GRAVITY = 2.6, JUMP_VEL = -19, OBS_SPEED = 4.5;
  let charY = 0, velY = 0, alive = true, started = false;
  let obstacles = [], score = 0, frame = 0, nextSpawn = 80;

  function reset() {
    charY = 0; velY = 0; alive = true; started = false;
    obstacles = []; score = 0; frame = 0; nextSpawn = 80;
  }

  function jump() {
    if (!alive) { reset(); return; }
    if (!started) { started = true; return; }
    if (charY === 0) velY = JUMP_VEL;
  }

  gc.addEventListener('click', jump);
  gc.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });

  function loop() {
    requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);

    // sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(237,213,255,0.5)');
    g.addColorStop(1, 'rgba(214,238,255,0.5)');
    ctx.fillStyle = g;
    ctx.roundRect(0, 0, W, H, 14);
    ctx.fill();

    // ground
    ctx.fillStyle = '#C8A8E9';
    ctx.fillRect(0, H - GROUND, W, 3);

    // clouds
    ctx.font = '20px serif'; ctx.globalAlpha = 0.5;
    ctx.fillText('☁️', W * 0.2, 24);
    ctx.fillText('☁️', W * 0.65, 18);
    ctx.globalAlpha = 1;

    if (started && alive) {
      velY += GRAVITY;
      charY = Math.max(0, charY - velY);
      obstacles = obstacles.map(o => ({...o, x: o.x - OBS_SPEED})).filter(o => o.x > -OBS_SIZE - 10);
      nextSpawn--;
      if (nextSpawn <= 0) {
        obstacles.push({ x: W + 10 });
        nextSpawn = 80 + Math.floor(Math.random() * 60);
        score++;
      }
      frame++;
      // collision
      for (const o of obstacles) {
        if (o.x < CHAR_X + CHAR_SIZE - 8 && o.x + OBS_SIZE > CHAR_X + 8 && charY < OBS_SIZE - 6) {
          alive = false;
        }
      }
    }

    // draw char
    ctx.font = CHAR_SIZE + 'px serif';
    ctx.fillText('⭐', CHAR_X, H - GROUND - charY - 2);

    // draw obstacles
    ctx.font = OBS_SIZE + 'px serif';
    for (const o of obstacles) ctx.fillText('🍄', o.x, H - GROUND - 2);

    // score
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#9B59B6';
    ctx.textAlign = 'right';
    ctx.fillText('⭐ ' + score, W - 10, 18);
    ctx.textAlign = 'left';

    // prompt
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#7B3FA0';
    ctx.textAlign = 'center';
    if (!started && alive) ctx.fillText('Tap to play! 🎮', W / 2, H / 2 + 5);
    if (!alive) ctx.fillText('Game over! Score: ' + score + ' · Tap to restart 🔄', W / 2, H / 2 + 5);
    ctx.textAlign = 'left';
  }
  loop();
})();

// ═══════════════════════════════════════════════════════
//  FREE DRAW
// ═══════════════════════════════════════════════════════
const COLORS = [
  '#FF0000','#FF4500','#FF6B35','#FF9500','#FFD700','#90EE90',
  '#00C853','#00BCD4','#2196F3','#3F51B5','#9C27B0','#E91E63',
  '#FF69B4','#A0522D','#808080','#000000','#FFFFFF','#FFB6C1',
  '#87CEEB','#98FB98'
];

let drawCtx, strokes = [], currentStroke = null;
let drawColor = '#FF0000', brushSize = 4, isEraser = false;
let coloringPageSvg = null;
let coloringImageLoaded = false;

function buildPalette() {
  const p = document.getElementById('draw-palette');
  p.innerHTML = '';
  COLORS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === '#FFFFFF' ? ' swatch-white' : '') + (c === drawColor && !isEraser ? ' active' : '');
    s.style.background = c;
    s.onclick = () => { drawColor = c; isEraser = false; document.getElementById('eraser-btn').classList.remove('active'); refreshPalette(); };
    p.appendChild(s);
  });
}

function refreshPalette() {
  document.querySelectorAll('#draw-palette .swatch').forEach((s, i) => {
    s.classList.toggle('active', COLORS[i] === drawColor && !isEraser);
  });
}

function setBrush(size, el) {
  brushSize = size;
  document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function toggleEraser() {
  isEraser = !isEraser;
  document.getElementById('eraser-btn').classList.toggle('active', isEraser);
  refreshPalette();
}

function undoStroke() {
  if (strokes.length === 0) return;
  strokes.pop();
  redrawCanvas();
}

function clearCanvas() {
  if (!confirm('Clear the drawing?')) return;
  strokes = [];
  redrawCanvas();
}

function saveDrawing() {
  const link = document.createElement('a');
  link.download = 'anges-world-drawing.png';
  link.href = document.getElementById('draw-canvas').toDataURL();
  link.click();
}

function redrawCanvas() {
  const canvas = document.getElementById('draw-canvas');
  drawCtx.clearRect(0, 0, canvas.width, canvas.height);
  drawCtx.fillStyle = '#fff';
  drawCtx.fillRect(0, 0, canvas.width, canvas.height);

  if (coloringPageSvg) {
    const img = new Image();
    const svgBlob = new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="${canvas.width}" height="${canvas.height}">${coloringPageSvg}</svg>`], {type:'image/svg+xml'});
    img.src = URL.createObjectURL(svgBlob);
    img.onload = () => {
      drawCtx.drawImage(img, 0, 0);
      URL.revokeObjectURL(img.src);
      drawStrokes();
    };
  } else {
    drawStrokes();
  }
}

function drawStrokes() {
  strokes.forEach(stroke => {
    if (stroke.points.length === 0) return;
    drawCtx.beginPath();
    drawCtx.strokeStyle = stroke.color;
    drawCtx.lineWidth = stroke.size;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    if (stroke.points.length === 1) {
      drawCtx.arc(stroke.points[0].x, stroke.points[0].y, stroke.size / 2, 0, Math.PI * 2);
      drawCtx.fillStyle = stroke.color;
      drawCtx.fill();
    } else {
      drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length - 1; i++) {
        const mx = (stroke.points[i].x + stroke.points[i+1].x) / 2;
        const my = (stroke.points[i].y + stroke.points[i+1].y) / 2;
        drawCtx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, mx, my);
      }
      const last = stroke.points[stroke.points.length - 1];
      drawCtx.lineTo(last.x, last.y);
      drawCtx.stroke();
    }
  });
  document.getElementById('undo-btn').disabled = strokes.length === 0;
}

function getPos(e, canvas) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - r.left) * scaleX, y: (src.clientY - r.top) * scaleY };
}

function initDrawCanvas() {
  const wrap = document.getElementById('draw-canvas-wrap');
  const canvas = document.getElementById('draw-canvas');
  const size = Math.min(wrap.clientWidth - 16, wrap.clientHeight - 16);
  canvas.width = size;
  canvas.height = size;
  drawCtx = canvas.getContext('2d');
  strokes = [];
  buildPalette();
  redrawCanvas();

  function onStart(e) {
    e.preventDefault();
    const p = getPos(e, canvas);
    currentStroke = { points: [p], color: isEraser ? '#FFFFFF' : drawColor, size: brushSize };
  }
  function onMove(e) {
    e.preventDefault();
    if (!currentStroke) return;
    const p = getPos(e, canvas);
    currentStroke.points.push(p);
    // live draw
    const pts = currentStroke.points;
    drawCtx.beginPath();
    drawCtx.strokeStyle = currentStroke.color;
    drawCtx.lineWidth = currentStroke.size;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    if (pts.length >= 2) {
      const prev = pts[pts.length - 2];
      const curr = pts[pts.length - 1];
      drawCtx.moveTo(prev.x, prev.y);
      drawCtx.lineTo(curr.x, curr.y);
      drawCtx.stroke();
    }
  }
  function onEnd(e) {
    if (!currentStroke) return;
    strokes.push(currentStroke);
    currentStroke = null;
    document.getElementById('undo-btn').disabled = false;
  }

  // Remove old listeners by cloning
  const nc = canvas.cloneNode(true);
  canvas.parentNode.replaceChild(nc, canvas);
  nc.addEventListener('mousedown', onStart);
  nc.addEventListener('mousemove', onMove);
  nc.addEventListener('mouseup', onEnd);
  nc.addEventListener('touchstart', onStart, { passive: false });
  nc.addEventListener('touchmove', onMove, { passive: false });
  nc.addEventListener('touchend', onEnd);
  drawCtx = nc.getContext('2d');
  redrawCanvas();
}

function showDraw(pageData) {
  coloringPageSvg = pageData ? pageData.svgData : null;
  document.getElementById('draw-title').textContent = pageData ? pageData.name : 'Free Draw';
  showScreen('screen-draw');
}

let cbnPage = null, cbnSelected = null, cbnFilled = {};

function buildCBNGallery() {
  const grid = document.getElementById('cbn-gallery-grid');
  CBN_PAGES.forEach(p => {
    const card = document.createElement('div');
    card.className = 'gallery-card';
    const dots = Object.values(p.colorMap).map(c =>
      `<div class="cbn-dot" style="background:${c};border-color:${c==='#FFFFFF'?'#aaa':c}"></div>`
    ).join('');
    card.innerHTML = `<div class="card-emoji">${p.emoji}</div><div class="card-name">${p.name}</div><div class="cbn-dots">${dots}</div>`;
    card.onclick = () => openCBN(p);
    grid.appendChild(card);
  });
}

function openCBN(page) {
  cbnPage = page;
  cbnSelected = null;
  cbnFilled = {};
  document.getElementById('cbn-title').textContent = page.name;
  document.getElementById('cbn-celebrate').classList.remove('show');

  // Build SVG
  const container = document.getElementById('cbn-svg-container');
  container.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" style="display:block;width:100%;height:auto;">${page.svgContent}</svg>`;
  const svg = container.querySelector('svg');
  svg.querySelectorAll('[data-region]').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      const rid = el.getAttribute('data-region');
      if (!cbnSelected) { showCBNHint(); return; }
      const color = page.colorMap[cbnSelected];
      el.setAttribute('fill', color);
      cbnFilled[rid] = color;
      checkCBNComplete(svg);
    });
  });

  // Build key
  const keyGrid = document.getElementById('cbn-key-grid');
  keyGrid.innerHTML = '';
  Object.entries(page.colorMap).forEach(([num, color]) => {
    const item = document.createElement('div');
    item.className = 'cbn-key-item';
    item.id = 'cbn-key-' + num;
    item.innerHTML = `<div class="cbn-key-swatch" style="background:${color};border-color:${color==='#FFFFFF'?'#999':color}"></div><div class="cbn-key-num">${num}</div>`;
    item.onclick = () => selectCBNColor(Number(num));
    keyGrid.appendChild(item);
  });

  updateCBNSelected();
  showScreen('screen-cbn');
}

function selectCBNColor(num) {
  cbnSelected = num;
  updateCBNSelected();
}

function updateCBNSelected() {
  document.querySelectorAll('.cbn-key-item').forEach(el => el.classList.remove('active'));
  const row = document.getElementById('cbn-selected-row');
  if (cbnSelected && cbnPage) {
    const color = cbnPage.colorMap[cbnSelected];
    document.getElementById('cbn-key-' + cbnSelected)?.classList.add('active');
    row.innerHTML = `<div class="cbn-selected-swatch" style="background:${color}"></div><span>Color ${cbnSelected} selected — tap a region!</span>`;
  } else {
    row.innerHTML = '<span>👇 Tap a number below to pick a color</span>';
  }
}

function showCBNHint() {
  const row = document.getElementById('cbn-selected-row');
  row.innerHTML = '<span style="color:#e74c3c">👇 Pick a color number first!</span>';
  setTimeout(updateCBNSelected, 1500);
}

function checkCBNComplete(svg) {
  const regions = svg.querySelectorAll('[data-region]');
  const total = new Set([...regions].map(r => r.getAttribute('data-region'))).size;
  const done = Object.keys(cbnFilled).length;
  if (done >= total) document.getElementById('cbn-celebrate').classList.add('show');
}

function resetCBN() {
  if (!confirm('Start over?')) return;
  openCBN(cbnPage);
}

function saveCBN() {
  const svg = document.querySelector('#cbn-svg-container svg');
  if (!svg) return;
  const data = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.download = 'anges-world-coloring.svg';
  a.href = url;
  a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
buildColoringGallery();
buildCBNGallery();
</script>
</body>
