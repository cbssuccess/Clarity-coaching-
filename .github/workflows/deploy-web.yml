name: Deploy Anges World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kids-drawing-app/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: kids-drawing-app

      - name: Build web app
        run: npx expo export --platform web
        working-directory: kids-drawing-app

      - name: Fix asset paths for GitHub Pages subdirectory
        run: |
          sed -i 's|src="/_expo/|src="_expo/|g' kids-drawing-app/dist/index.html
          sed -i 's|href="/favicon.ico"|href="favicon.ico"|g' kids-drawing-app/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kids-drawing-app/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
