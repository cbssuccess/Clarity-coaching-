<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whimsical Dreams | Botanics &amp; Treasures</title>
<meta name="description" content="Whimsical Dreams — Botanics &amp; Treasures. Carefully curated plants, clothing and treasures from Auburn, Maine.">
<!-- Remove the next line once the site is on its own domain so Google can list it -->
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Gelasio:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<main>
  <section class="swirl home-top">
    <img class="hero-photo" src="images/hero.jpg" alt="A variegated monstera surrounded by houseplants">
    <div class="wrap hero-text">
      <p class="tagline">Carefully curated treasures for your special haven</p>
      <h1 class="brand-name">Whimsical<br>Dreams</h1>
      <p class="brand-sub">Botanics &amp; Treasures</p>
      <a class="pill-btn" href="#shop">Shop All</a>
    </div>
  </section>
  <section class="shop" id="shop">
    <div class="wrap">
      <h1>Shop All</h1>
      <div class="filter-row">
        <select class="categories" aria-label="Categories">
          <option value="all">All categories</option>
          <option value="plants">Plants</option>
          <option value="clothing">Clothing and Wares</option>
          <option value="decor">Home Decor, Crafts, and Treasures</option>
        </select>
      </div>
      <p class="count"></p>
      <div class="grid" data-category="all"></div>
    </div>
  </section>
</main>
<script src="products.js"></script>
<script src="site.js"></script>
</body>
</html>
